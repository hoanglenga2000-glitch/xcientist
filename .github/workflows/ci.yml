name: CI

on:
  push:
    branches: [master, "codex/**"]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  python-release:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      EVOMIND_PORTABLE_SOURCE_CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          python-version: "3.12.13"
          activate-environment: true
          enable-cache: false
          working-directory: ${{ runner.temp }}
      - name: Bootstrap pip in the pinned Python environment
        run: python -m ensurepip --upgrade
      - name: Install test and build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run production stability gate
        run: python scripts/run_ci_checks.py
      - name: Enforce Ruff release targets and legacy non-regression baseline
        run: python scripts/verify_ruff_baseline.py
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install wheel in a clean environment
        shell: pwsh
        run: |
          python -m venv .release-smoke
          .\.release-smoke\Scripts\python.exe -m pip install --upgrade pip
          $wheel = Get-ChildItem dist\*.whl | Select-Object -First 1
          .\.release-smoke\Scripts\python.exe -m pip install $wheel.FullName
          .\.release-smoke\Scripts\evomind.exe --help
          .\.release-smoke\Scripts\evomind.exe workspace --help
          .\.release-smoke\Scripts\evomind.exe benchmark-agent --help
      - name: Validate installed wheel without packaging-tool leakage
        shell: pwsh
        run: |
          python -m venv --without-pip .release-sbom
          $wheel = Get-ChildItem dist\*.whl | Select-Object -First 1
          python -m pip --python .\.release-sbom\Scripts\python.exe install $wheel.FullName
          python -m pip --python .\.release-sbom\Scripts\python.exe check
          .\.release-sbom\Scripts\python.exe -c "import xsci, research_os"
          python -m pip --python .\.release-sbom\Scripts\python.exe uninstall --yes xcientist

  frontend-release:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web/research-agent-workstation
    env:
      DATABASE_URL: file:./ci-workstation.db
      NEXT_TELEMETRY_DISABLED: "1"
      RUST_LOG: info
    steps:
      - uses: actions/checkout@v4
      - name: Verify release sources and trust root exist in the clean checkout
        working-directory: .
        shell: pwsh
        run: |
          $required = @(
            "scripts/verify_release_bundle.py",
            "scripts/release_finalize.py",
            "scripts/sign_evomind_release_manifest.mjs",
            "packages/evomind-cli/package.json",
            "packages/evomind-cli/package-lock.json",
            "packages/evomind-cli/keys/release-ed25519-public.pem",
            "tests/fixtures/release/fixture-ed25519-private.pem",
            "tests/fixtures/release/fixture-ed25519-public.pem"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Release input is missing from the clean checkout: $path"
            }
            git ls-files --error-unmatch -- $path | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Release input is not tracked in the clean checkout: $path"
            }
          }
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: web/research-agent-workstation/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          python-version: "3.12.13"
          activate-environment: true
          enable-cache: false
          working-directory: ${{ runner.temp }}
      - name: Bootstrap pip in the pinned Python environment
        working-directory: .
        run: python -m ensurepip --upgrade
      - name: Install Python runtime dependencies
        working-directory: .
        run: python -m pip install -r requirements.txt
      - name: Pin npm to the release toolchain contract
        run: npm install --global npm@11.6.2
      - name: Test the npm CLI package and inspect its packed contents
        working-directory: packages/evomind-cli
        run: |
          npm ci --ignore-scripts
          npm test
          npm run pack:check
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit production and development dependencies
        run: |
          npm run audit:prod
          npm run audit:all
      - name: Apply clean SQLite migrations
        run: npm run db:migrate
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build workstation
        run: npm run build
      - name: Verify the fail-closed scientist upgrade campaign transport
        run: npm run test:upgrade-campaign
      - name: Verify frontend API and navigation contracts
        working-directory: .
        run: python scripts/verify_workstation_frontend_api_contract.py
      - name: Verify functional action and lifecycle contract
        working-directory: .
        run: python scripts/verify_launchfix_functional_contract.py
      - name: Verify all pages and browser interaction contracts on a clean database
        working-directory: .
        shell: pwsh
        run: ./scripts/verify_release_browser_e2e.ps1 -OutputDir ./artifacts/ci-browser-e2e -Port 18198
      - name: Remove source-tree side effects from browser E2E
        working-directory: .
        shell: pwsh
        run: |
          git restore -- web/research-agent-workstation/.next-rollback.json
          $generated = @(
            ".workstation-install.json",
            "web/research-agent-workstation/prisma/workstation.db-shm",
            "web/research-agent-workstation/prisma/workstation.db-wal",
            "web/research-agent-workstation/prisma/workstation.db-journal"
          )
          foreach ($path in $generated) {
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
          }
          $status = git status --porcelain --untracked-files=all
          if ($status) { throw "Browser E2E left source-tree changes: $status" }
      - name: Build deterministic standalone release bundle
        working-directory: .
        shell: pwsh
        run: ./scripts/build_release_bundle.ps1 -OutputRoot ./artifacts/ci-release -SkipInstall -SkipAudit
      - name: Resolve deterministic release outputs
        id: release
        working-directory: .
        shell: pwsh
        run: |
          $result = Get-Content -LiteralPath artifacts/ci-release/build-result.json -Raw | ConvertFrom-Json
          $zip = [IO.Path]::GetFullPath([string]$result.zip)
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            throw "Release ZIP declared by build-result.json is missing: $zip"
          }
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$($result.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Pack the production-trust CLI tarball for protected tags
        if: startsWith(github.ref, 'refs/tags/v')
        id: production-cli
        working-directory: packages/evomind-cli
        shell: pwsh
        run: |
          $destination = [IO.Path]::GetFullPath("../../artifacts/ci-release/npm-production")
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $packed = npm pack . --json --pack-destination $destination | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or @($packed).Count -ne 1) {
            throw "npm pack did not produce exactly one production CLI tarball"
          }
          $tgz = Join-Path $destination $packed[0].filename
          if (-not (Test-Path -LiteralPath $tgz -PathType Leaf)) { throw "Packed CLI tarball is missing" }
          "tgz=$tgz" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Pack a fixture-trust CLI tarball for ordinary CI
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        id: fixture-cli
        working-directory: .
        shell: pwsh
        run: |
          $fixtureSource = Join-Path $env:RUNNER_TEMP "evomind-cli-fixture-${{ github.run_id }}-${{ github.run_attempt }}"
          if (Test-Path -LiteralPath $fixtureSource) { throw "Fixture package path unexpectedly exists" }
          Copy-Item -LiteralPath packages/evomind-cli -Destination $fixtureSource -Recurse
          Copy-Item -LiteralPath tests/fixtures/release/fixture-ed25519-public.pem `
            -Destination (Join-Path $fixtureSource "keys/release-ed25519-public.pem") -Force
          $destination = [IO.Path]::GetFullPath("artifacts/ci-release/npm-fixture")
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $packed = npm pack $fixtureSource --json --pack-destination $destination | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or @($packed).Count -ne 1) {
            throw "npm pack did not produce exactly one fixture CLI tarball"
          }
          $tgz = Join-Path $destination $packed[0].filename
          if (-not (Test-Path -LiteralPath $tgz -PathType Leaf)) { throw "Fixture CLI tarball is missing" }
          "tgz=$tgz" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Sign an ordinary-CI fixture manifest
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: .
        env:
          EVOMIND_RELEASE_PRIVATE_KEY_FILE: ${{ github.workspace }}/tests/fixtures/release/fixture-ed25519-private.pem
        shell: pwsh
        run: >-
          node scripts/sign_evomind_release_manifest.mjs
          --bundle "${{ steps.release.outputs.zip }}"
          --output artifacts/ci-release/fixture/latest.json
          --version "${{ steps.release.outputs.version }}"
          --url "https://fixtures.invalid/EvoMind-win-x64-${{ steps.release.outputs.version }}.zip"
          --published-at "2026-08-03T00:00:00Z"
      - name: Verify fixture signature, npm tarball, bundle hashes, and clean lifecycle
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: .
        run: >-
          python scripts/verify_release_bundle.py
          --manifest artifacts/ci-release/fixture/latest.json
          --cli-tgz "${{ steps.fixture-cli.outputs.tgz }}"
          --zip "${{ steps.release.outputs.zip }}"
          --json artifacts/ci-release/verification.json
      - name: Stage protected-tag release inputs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: protected-tag-release-inputs
          if-no-files-found: error
          retention-days: 1
          path: |
            ${{ steps.release.outputs.zip }}
            ${{ steps.production-cli.outputs.tgz }}
            artifacts/ci-release/build-result.json

  capability-certification:
    if: startsWith(github.ref, 'refs/tags/v') && vars.EVOMIND_CAPABILITY_CERTIFICATION_ENABLED == 'true'
    needs: [python-release, frontend-release]
    runs-on: windows-latest
    timeout-minutes: 30
    environment: production-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          python-version: "3.12.13"
          activate-environment: true
          enable-cache: false
          working-directory: ${{ runner.temp }}
      - name: Download the externally generated capability evidence bundle
        shell: pwsh
        env:
          EVIDENCE_URL: ${{ secrets.EVOMIND_CAPABILITY_EVIDENCE_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EVIDENCE_URL)) {
            throw "EVOMIND_CAPABILITY_EVIDENCE_URL is required for protected tags"
          }
          Invoke-WebRequest -Uri $env:EVIDENCE_URL -OutFile capability-evidence.zip
      - name: Extract the immutable external evidence bundle
        run: >-
          python scripts/extract_capability_evidence_bundle.py
          capability-evidence.zip capability-evidence
          --expected-sha256 "${{ vars.EVOMIND_CAPABILITY_BUNDLE_SHA256 }}"
      - name: Verify scope, exact source bytes, baselines, and frozen evaluator
        shell: pwsh
        env:
          BASELINE_AGENTS: ${{ vars.EVOMIND_CAPABILITY_BASELINE_AGENTS }}
        run: |
          $baselines = @($env:BASELINE_AGENTS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          if ($baselines.Count -lt 2) { throw "At least two external baseline agents are required" }
          $arguments = @(
            'scripts/verify_capability_certification.py', 'capability-evidence/report.json',
            '--repo-root', '.', '--artifact-root', 'capability-evidence',
            '--expected-report-sha256', '${{ vars.EVOMIND_CAPABILITY_REPORT_SHA256 }}',
            '--expected-suite-id', '${{ vars.EVOMIND_CAPABILITY_SUITE_ID }}',
            '--expected-suite-sha256', '${{ vars.EVOMIND_CAPABILITY_SUITE_SHA256 }}',
            '--expected-evaluator-id', '${{ vars.EVOMIND_CAPABILITY_EVALUATOR_ID }}',
            '--expected-evaluator-sha256', '${{ vars.EVOMIND_CAPABILITY_EVALUATOR_SHA256 }}',
            '--minimum-hidden-tasks', '100',
            '--minimum-domains', '8',
            '--minimum-tasks-per-domain', '3',
            '--minimum-repeats', '3',
            '--minimum-wilson-lower-bound', '0.75',
            '--maximum-timeout-rate', '0',
            '--minimum-upgrade-candidates', '2',
            '--output', 'capability-certification-result.json'
          )
          foreach ($baseline in $baselines) { $arguments += @('--baseline-agent', $baseline) }
          python @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Built workstation source bytes do not match externally certified source bytes or another certification check failed"
          }
      - name: Preserve the source-specific certification result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capability-certification-result
          if-no-files-found: error
          retention-days: 7
          path: capability-certification-result.json

  release-artifacts:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-release, frontend-release]
    runs-on: windows-latest
    timeout-minutes: 45
    environment: production-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          python-version: "3.12.13"
          activate-environment: true
          enable-cache: false
          working-directory: ${{ runner.temp }}
      - name: Pin npm to the release toolchain contract
        run: npm install --global npm@11.6.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: protected-tag-release-inputs
          path: artifacts/protected-tag
      - name: Materialize the protected production signing key
        id: production-key
        shell: pwsh
        env:
          EVOMIND_RELEASE_PRIVATE_KEY_PEM: ${{ secrets.EVOMIND_RELEASE_PRIVATE_KEY_PEM }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EVOMIND_RELEASE_PRIVATE_KEY_PEM)) {
            throw "The protected release environment did not provide its signing key"
          }
          $key = Join-Path $env:RUNNER_TEMP "evomind-release-private.pem"
          [IO.File]::WriteAllText($key, $env:EVOMIND_RELEASE_PRIVATE_KEY_PEM, [Text.UTF8Encoding]::new($false))
          "path=$key" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Sign the protected tag manifest
        id: production-manifest
        shell: pwsh
        env:
          EVOMIND_RELEASE_PRIVATE_KEY_FILE: ${{ steps.production-key.outputs.path }}
        run: |
          $result = Get-Content -LiteralPath artifacts/protected-tag/build-result.json -Raw | ConvertFrom-Json
          $zip = @(Get-ChildItem -LiteralPath artifacts/protected-tag -Filter "EvoMind-win-x64-*.zip" -File -Recurse)
          if ($zip.Count -ne 1) { throw "Expected exactly one protected-tag release ZIP" }
          $manifest = [IO.Path]::GetFullPath("artifacts/protected-tag/latest.json")
          node scripts/sign_evomind_release_manifest.mjs `
            --bundle $zip[0].FullName `
            --output $manifest `
            --version ([string]$result.version) `
            --url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($zip[0].Name)" `
            --published-at ([DateTimeOffset]::UtcNow.ToString("o"))
          if ($LASTEXITCODE -ne 0) { throw "Protected tag manifest signing failed" }
          "path=$manifest" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "zip=$($zip[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Verify the protected manifest, production npm tarball, and release ZIP
        shell: pwsh
        run: |
          $tgz = @(Get-ChildItem -LiteralPath artifacts/protected-tag -Filter "*.tgz" -File -Recurse)
          if ($tgz.Count -ne 1) { throw "Expected exactly one production CLI tarball" }
          python scripts/verify_release_bundle.py `
            --manifest "${{ steps.production-manifest.outputs.path }}" `
            --cli-tgz $tgz[0].FullName `
            --zip "${{ steps.production-manifest.outputs.zip }}" `
            --json artifacts/protected-tag/verification.json
      - name: Upload the verified protected release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evomind-${{ github.ref_name }}-verified-release
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/protected-tag/**/*.zip
            artifacts/protected-tag/**/*.tgz
            artifacts/protected-tag/latest.json
            artifacts/protected-tag/latest.json.sha256
            artifacts/protected-tag/verification.json
            artifacts/protected-tag/build-result.json
      - name: Remove the materialized production signing key
        if: always()
        shell: pwsh
        run: |
          $key = "${{ steps.production-key.outputs.path }}"
          if ($key -and (Test-Path -LiteralPath $key -PathType Leaf)) {
            Remove-Item -LiteralPath $key -Force
          }
