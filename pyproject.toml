[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xcientist"
version = "0.3.0"
description = "EvoMind: an auditable self-evolving AI scientist for ML research (Kaggle/MLE-Bench)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pandas>=2.0,<4.0",
    "numpy>=1.24,<3.0",
    "scikit-learn>=1.3,<2.0",
    "xgboost>=3.0,<4.0",
    "PyYAML>=6.0,<7.0",
    "jsonschema>=4.20,<5.0",
    "python-docx>=1.1,<2.0",
    "kaggle>=1.6,<3.0",
    "paramiko>=3.0,<6.0",
    "python-dotenv>=1.0,<2.0",
    "Pillow>=10.0,<13.0",
    "PyMuPDF>=1.24,<2.0",
    "diskcache>=5.6,<6.0",
    "tenacity>=8.5,<10.0",
    "appdirs>=1.4.4,<2.0",
    "py7zr>=0.21,<2.0",
    "psutil>=5.9,<8.0",
]

[project.optional-dependencies]
dashboard = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
xsci = "xsci.__main__:main"
evomind = "xsci.kaggle:main"
autokaggle = "xsci.kaggle:main"
kaggle-official = "xsci.kaggle:official_main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["evomind_runtime*", "research_os*", "research_agent_workstation*", "xsci*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow: long-running tests (deselect with '-m \"not slow\"')",
    "network: requires network/proxy access",
    "gpu: requires the remote GPU server",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    ".venv",
    "artifacts",
    "**/.backups",
    "**/backups",
    "backups",
    "external-projects",
    "experiments",
    "node_modules",
    "open-reverselab",
    "scripts/_quarantine",
    "web",
    "workspace",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
